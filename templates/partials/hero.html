{{define "hero"}}
<header class="hero" id="top">
  <canvas id="field" aria-hidden="true"></canvas>

  <div class="hero-type">
    <p class="eyebrow">{{.Me.Role}}</p>
    <h1 class="name">{{.Me.Name}}</h1>
    <p class="title">Backend &middot; Infrastructure &middot; Distributed systems</p>
    <p class="sub">{{.Me.Tagline}}</p>
  </div>

  <div class="rail">
    <nav>
      <a class="enter" href="#about">Enter &darr;</a>
      <a href="{{.Me.GitHub}}" rel="noopener">GitHub</a>
      <a href="mailto:{{.Me.Email}}">Email</a>
    </nav>
    <span class="hint" id="hint">Move your cursor to pull the plates apart</span>
  </div>
</header>
{{end}}
