services:
  portfolio:
    image: ghcr.io/YOURUSER/portfolio:latest
    container_name: portfolio
    restart: unless-stopped
    # Bind to the WireGuard address only — the Pi should not answer
    # on its LAN interface. Caddy on the droplet is the sole entrypoint.
    ports:
      - "10.8.0.2:8080:8080"
    environment:
      - ADDR=:8080
      - TZ=Etc/UTC
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
