services:
  portfolio:
    image: ghcr.io/ciaranotter/portfolio:${IMAGE_TAG:-latest}
    container_name: portfolio
    restart: unless-stopped
    # Loopback only. The reverse tunnel to the VPS is the single way in, so
    # the Pi must not answer on its LAN interface.
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      - ADDR=:8080
      - TZ=Etc/UTC
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"