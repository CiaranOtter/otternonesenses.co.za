name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      domain:
        description: "Server name Caddy should answer on"
        required: false
      tunnel_port:
        description: "Port on the VPS that forwards to the Pi"
        required: false
      app_port:
        description: "Port the container listens on, on the Pi"
        required: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  SITE:        otternonesenses
  IMAGE:       ghcr.io/ciaranotter/otternonesenses
  # Inputs win, then repository variables, then these defaults. Set the
  # variables under Settings -> Secrets and variables -> Actions -> Variables
  # so a push to main uses the same values as a manual run.
  DOMAIN:      ${{ inputs.domain      || vars.SITE_DOMAIN || 'otternonesenses.com' }}
  TUNNEL_PORT: ${{ inputs.tunnel_port || vars.TUNNEL_PORT || '9080' }}
  APP_PORT:    ${{ inputs.app_port    || vars.APP_PORT    || '8080' }}
  TUNNEL_SSH_PORT:    ${{ vars.SSH_TUNNEL_PORT || '9022' }}

jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # 1. BUILD AND PUBLISH
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute tag
        id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # No QEMU: the Dockerfile pins its build stage to $BUILDPLATFORM and
      # cross-compiles via GOARCH, so the Go toolchain runs natively on amd64.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ───────────────────────────────────────────────────────────────────────────
  # 2. CADDY SITE CONFIG ON THE VPS
  #    One file per site in /etc/caddy/sites/. Validates the whole config and
  #    only then reloads, so a bad config never reaches a running Caddy.
  # ───────────────────────────────────────────────────────────────────────────
  proxy:
    name: Update Caddy on VPS
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render site config
        id: render
        run: |
          cat > site.caddy <<EOF
          # Managed by GitHub Actions. Edits here will be overwritten.
          # site: ${SITE}  commit: ${GITHUB_SHA}
          ${DOMAIN}, www.${DOMAIN} {
              encode zstd gzip

              reverse_proxy 127.0.0.1:${TUNNEL_PORT} {
                  health_uri      /healthz
                  health_interval 30s
                  health_timeout  5s
              }

              header {
                  Strict-Transport-Security "max-age=31536000; includeSubDomains"
                  -Server
              }

              log {
                  output file /var/log/caddy/${SITE}.log
                  format console
              }

              handle_errors {
                  respond "Origin unavailable." {http.error.status_code}
              }
          }
          EOF
          echo "site_b64=$(base64 -w0 site.caddy)" >> "$GITHUB_OUTPUT"
          echo "main_b64=$(base64 -w0 infra/Caddyfile)" >> "$GITHUB_OUTPUT"

      - name: Install and reload
        uses: appleboy/ssh-action@v1
        env:
          SITE_B64: ${{ steps.render.outputs.site_b64 }}
          MAIN_B64: ${{ steps.render.outputs.main_b64 }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: SITE_B64,MAIN_B64,SITE
          script: |
            set -euo pipefail
            sudo mkdir -p /etc/caddy/sites /var/log/caddy

            # Deploy this site's config
            TARGET="/etc/caddy/sites/${SITE}.caddy"
            sudo cp -f "$TARGET" "/tmp/${SITE}.caddy.bak" 2>/dev/null || true
            echo "$SITE_B64" | base64 -d | sudo tee "$TARGET" >/dev/null

            if ! sudo caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile; then
              echo "config invalid, rolling back"
              sudo cp -f /tmp/Caddyfile.bak /etc/caddy/Caddyfile 2>/dev/null || true
              [ -f "/tmp/${SITE}.caddy.bak" ] && sudo cp -f "/tmp/${SITE}.caddy.bak" "$TARGET" || sudo rm -f "$TARGET"
              exit 1
            fi

            sudo systemctl reload caddy
            echo "caddy reloaded for ${SITE}"

  # ───────────────────────────────────────────────────────────────────────────
  # 3. REVERSE TUNNEL ON THE PI
  #    Idempotent by necessity: restarting the tunnel drops the SSH session
  #    this job is running inside, so it only restarts when the unit changed.
  # ───────────────────────────────────────────────────────────────────────────
  tunnel:
    name: Update reverse tunnel
    needs: proxy
    runs-on: ubuntu-latest

    steps:
      - name: Render systemd unit
        id: render
        run: |
          cat > tunnel.service <<EOF
          # Managed by GitHub Actions. Edits here will be overwritten.
          [Unit]
          Description=Reverse tunnel to VPS (${SITE})
          After=network-online.target
          Wants=network-online.target

          [Service]
          User=${{ secrets.LOCAL_USER }}
          ExecStart=/usr/bin/autossh -M 0 -N \\
            -o ServerAliveInterval=30 \\
            -o ServerAliveCountMax=3 \\
            -o ExitOnForwardFailure=yes \\
            -o StrictHostKeyChecking=accept-new \\
            -R ${SSH_PORT}:localhost:22 \\
            -R ${TUNNEL_PORT}:localhost:${APP_PORT} \\
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          EOF
          echo "b64=$(base64 -w0 tunnel.service)" >> "$GITHUB_OUTPUT"

      - name: Apply on the Pi
        uses: appleboy/ssh-action@v1
        env:
          UNIT_B64: ${{ steps.render.outputs.b64 }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: UNIT_B64,SITE,SSH_PORT
          script_stop: true
          command_timeout: 5m
          script: |
            set -euo pipefail

            ssh -p "${SSH_PORT}" \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ secrets.LOCAL_USER }}@localhost \
              "set -eu
               UNIT=/etc/systemd/system/tunnel-${SITE}.service
               echo '${UNIT_B64}' | base64 -d > /tmp/tunnel.new

               if [ -f \"\$UNIT\" ] && cmp -s /tmp/tunnel.new \"\$UNIT\"; then
                 echo 'tunnel unchanged, leaving the connection alone'
                 exit 0
               fi

               command -v autossh >/dev/null || sudo apt-get install -y autossh
               sudo cp /tmp/tunnel.new \"\$UNIT\"
               sudo systemctl daemon-reload
               sudo systemctl enable tunnel-${SITE}.service

               # Detached and delayed. Restarting the tunnel kills the SSH
               # session running this command, so the restart has to outlive
               # its own parent and happen after this shell has exited.
               sudo systemd-run --on-active=3 --unit=tunnel-restart-${SITE} \
                 systemctl restart tunnel-${SITE}.service
               echo 'restart scheduled'"

            # Wait, from the VPS, for the tunnel to come back.
            echo "waiting for tunnel ports"
            for i in $(seq 1 30); do
              if nc -z localhost "${SSH_PORT}" 2>/dev/null; then
                echo "tunnel is back after ${i} attempts"
                exit 0
              fi
              sleep 2
            done
            echo "tunnel did not come back within 60s"
            exit 1

  # ───────────────────────────────────────────────────────────────────────────
  # 4. DEPLOY ON THE PI
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Pi
    needs: [build, tunnel]
    runs-on: ubuntu-latest

    steps:
      - name: Compose up
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_TAG,SITE,APP_PORT,SSH_PORT
          script_stop: true
          command_timeout: 10m
          script: |
            set -euo pipefail

            ssh -p "${SSH_PORT}" \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ secrets.LOCAL_USER }}@localhost \
              "set -eu
               cd ~/${SITE}
               git fetch --quiet origin main
               git reset --hard --quiet origin/main

               export IMAGE_TAG='${IMAGE_TAG}'
               export APP_PORT='${APP_PORT}'

               docker compose pull
               docker compose up -d --remove-orphans
               docker image prune -f

               for i in \$(seq 1 15); do
                 if curl -fsS --max-time 3 http://127.0.0.1:${APP_PORT}/healthz >/dev/null; then
                   echo 'healthy'
                   exit 0
                 fi
                 sleep 2
               done
               echo 'health check never passed'
               docker compose logs --tail=50
               exit 1"

      - name: Verify through the proxy
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "https://${DOMAIN}/healthz" || true)
            if [ "$code" = "200" ]; then
              echo "live at https://${DOMAIN}"
              exit 0
            fi
            sleep 5
          done
          echo "site did not answer through the proxy"
          exit 1
